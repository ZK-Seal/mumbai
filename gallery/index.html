    --no-bg: #fbe8e5;
    --wait: #b86b1d;
    --wait-bg: #fbefdf;
    --text: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    /* The words on the app's main button, Theme.onAccent. */
    --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #dcab64;
      --accent-soft: #2a2416;
      --on-accent: #0e1626;
      --bg: #0e1626;
      --surface: #152036;
      --ink: #edf0f6;
      --muted: #939bad;
      --line: #283349;
      --no: #ff9f92;
      --no-bg: #301614;
      --wait: #f2b46b;
      --wait-bg: #33261a;
    }
    .logo.for-light { display: none; }
  }
  @media (prefers-color-scheme: light) {
    .logo.for-dark { display: none; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.45 var(--text);
  }
  main {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  main { padding-top: max(40px, env(safe-area-inset-top)); padding-bottom: max(40px, env(safe-area-inset-bottom)); }
  header { margin-bottom: 32px; text-align: center; }
  .logo { display: block; width: 180px; height: 180px; margin: 0 auto 20px; }
  @media (max-width: 480px) { .logo { width: 140px; height: 140px; } }
  h1 {
    margin: 0;
    font-size: clamp(25px, 6.4vw, 34px);
    line-height: 1.16;
    font-weight: 600;
    letter-spacing: -0.015em;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }
  .lede { margin: 10px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; text-wrap: balance; }
  #count { margin: 22px 0 0; color: var(--accent); font-size: 17px; font-weight: 500; }
  #event { margin: 2px 0 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  #count:empty, #event:empty { display: none; }
  .state {
    margin: 0 0 16px;
    padding: 12px;
    border-radius: 12px;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
  }
  .state.wait { color: var(--wait); background: var(--wait-bg); }
  .state.bad { color: var(--no); background: var(--no-bg); }
  .state.plain { color: var(--ink); background: var(--surface); border: 1px solid var(--line); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .retry {
    display: block;
    width: 100%;
    max-width: 320px;
    min-height: 44px;
    margin: 0 auto 16px;
    padding: 10px 16px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
  }
  .retry:disabled { opacity: 0.5; cursor: default; }

  /* The tree, mirrored around one centre line. Thin lines: down from the root, across, and down to the centre of each column. */
  .root, h2 {
    display: block;
    position: relative;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
    padding: 7px 18px;
    border: 1px solid var(--accent);
    border-radius: 999px;
    background: var(--surface);
    font-size: 14px;
    line-height: 1.35;
    font-weight: 600;
    letter-spacing: 0.005em;
    text-align: center;
    overflow-wrap: anywhere;
  }
  .root { margin-bottom: 22px; font-size: 15px; background: var(--accent); color: var(--on-accent); }
  .root::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 100%;
    height: 22px;
    border-left: 1px solid var(--accent);
  }
  .split {
    --gap: 16px;
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 0 var(--gap);
    padding-top: 22px;
  }
  .split::before {
    content: '';
    position: absolute;
    top: 0;
    left: calc((100% - var(--gap)) / 4);
    right: calc((100% - var(--gap)) / 4);
    height: 22px;
    border: 1px solid var(--accent);
    border-bottom: 0;
    border-radius: 12px 12px 0 0;
  }
  .limb { position: relative; display: flex; flex-direction: column; min-width: 0; }
  .caption { order: 2; margin: 10px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
  .branch {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 0;
    padding: 10px 0 0;
    list-style: none;
  }
  .branch > li { position: relative; }
  .branch > li::before {
    content: '';
    position: absolute;
    left: 50%;
    top: -10px;
    height: 10px;
    border-left: 1px solid var(--accent);
  }
  .entry {
    display: block;
    width: 100%;
    min-height: 62px;
    padding: 11px 8px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    text-align: center;
    overflow-wrap: anywhere;
    transition: opacity 0.15s, background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .entry { border-color: var(--accent); }
  button.entry:hover { background: var(--accent-soft); }
  .entry-name { display: block; font-size: 15px; font-weight: 500; line-height: 1.3; }
  .entry-sub { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.35; }
  .entry-sub.code { font-family: var(--mono); }
  .entry.absent { background: none; }
  .entry.absent .entry-name { color: var(--muted); font-weight: 400; }
  .entry[aria-current="true"] .entry-name { color: var(--accent); }
  .entry.lit { border-color: var(--accent); }

  /* One event's images, on the same centre line. */
  #images { margin-top: 32px; }
  #images .branch > li {
    padding: 2px 8px;
    border: 1px solid var(--accent);
    border-radius: 14px;
    background: var(--surface);
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; min-height: 48px; }
  .chain { color: var(--accent); font-size: 12px; }
  .seal-watch { margin: 0 0 24px; padding: 14px; border: 1px solid var(--accent); border-radius: 14px; background: var(--surface); text-align: center; scroll-margin-top: 16px; }
  .seal-steps { margin: 12px 0; padding: 0; list-style: none; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .seal-steps li { padding: 3px 0; }
  .seal-steps li.done { color: var(--ink); }
  .seal-steps li.done::before { content: '✓ '; color: var(--accent); }
  .seal-watch .frame { overflow: hidden; border-radius: 10px; }
  #images .branch > li.seal-focus { background: var(--accent-soft); }
  .name, .to {
    min-width: 0;
    min-height: 44px;
    padding: 4px 8px;
    border: 0;
    border-radius: 8px;
    background: none;
    text-align: left;
    overflow-wrap: anywhere;
    transition: opacity 0.15s, background-color 0.15s, color 0.15s;
  }
  .name { font-size: 16px; font-weight: 500; }
  .to { margin-left: auto; color: var(--muted); font: 400 13px/1.3 var(--mono); }
  .none { color: var(--muted); font-weight: 400; }
  .lighting .entry:not(.lit), .lighting .name:not(.lit), .lighting .to:not(.lit) { opacity: 0.45; }
  .lit { color: var(--accent); background: var(--accent-soft); }
  .lit .entry-name, .lit .entry-sub { color: var(--accent); }
  .to.unnamed { display: flex; align-items: center; }
  .fresh { animation: arrive 0.6s ease-out; }
  @keyframes arrive { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fresh { animation: none; } }

  /* Many names, one address. */
  #many {
    position: sticky;
    bottom: max(12px, env(safe-area-inset-bottom));
    margin-top: 20px;
    padding: 12px 40px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    text-align: center;
  }
  .many-names { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
  .many-arrow { margin: 2px 0; color: var(--muted); line-height: 1; }
  .many-one {
    display: inline-block;
    max-width: 100%;
    padding: 4px 14px;
    border: 1px solid var(--accent);
    border-radius: 999px;
    color: var(--accent);
    font: 400 12px/1.35 var(--mono);
    overflow-wrap: anywhere;
  }
  .many-line { margin: 6px 0 0; font-size: 14px; font-weight: 600; }
  .many-records { margin: 0; color: var(--muted); font-size: 12px; }
  .close {
    position: absolute;
    top: 0;
    right: 0;
    width: 44px;
    height: 44px;
    border: 0;
    background: none;
    color: var(--muted);
    font-size: 18px;
  }

  /* One image, opened in place. */
  .panel {
    margin: 2px -8px -2px;
    overflow: hidden;
    border-top: 1px solid var(--line);
    border-radius: 0 0 14px 14px;
  }
  .frame {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    padding: 16px;
    background: var(--accent-soft);
  }
  .frame.shown { display: block; min-height: 0; padding: 0; background: none; }
  .frame img { display: block; width: 100%; height: auto; }
  .note { margin: 0; color: var(--muted); font-size: 14px; text-align: center; }
  .facts { margin: 0; padding: 12px; }
  .facts dt { margin-top: 10px; color: var(--muted); font-size: 12px; }
  .facts dt:first-child { margin-top: 0; }
  .facts dd { margin: 0; overflow-wrap: anywhere; font-size: 14px; }
  .facts dd.code { font: 400 12px/1.45 var(--mono); }
  .facts .name { margin: -4px 0 0 -8px; min-height: 36px; font-size: 14px; }
  .mark {
    display: inline-block;
    margin: 12px 12px 0;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--wait);
    background: var(--wait-bg);
  }
  .mark.differs { color: var(--no); background: var(--no-bg); }
</style>
</head>

  retry: document.getElementById('retry'),
  tree: document.getElementById('tree'),
  images: document.getElementById('images'),
  many: document.getElementById('many'),
};

// All row text is untrusted. It reaches the page only through textContent, alt and validated hex.
function make(tag, className, text) {
  const node = document.createElement(tag);
  node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function setState(text, tone) {
  ui.state.textContent = text;
  ui.state.className = 'state ' + tone;
  ui.state.hidden = false;
}

function clearState() {
  ui.state.textContent = '';
  ui.state.hidden = true;
}

async function withTimeout(ms, work) {
  const control = new AbortController();
  const timer = setTimeout(() => control.abort(), ms);
  try {
    return await work(control.signal);
  } finally {
    clearTimeout(timer);
  }
}

class ReadFailure extends Error {
  constructor(busy, waitSeconds) {
    super('The records could not be read.');
    this.busy = busy;
    this.waitSeconds = waitSeconds;
  }
}

function secondsToWait(response) {
  const asked = parseInt(response.headers.get('retry-after') || '', 10);
  return Number.isNaN(asked) ? 5 : Math.min(Math.max(asked, 1), 60);
}

// Only rows our wallet created. The kind is a fixed word, so it cannot close the quoted string.
function kindQuery(kind) {
  return "arkiv.schema = str('" + kind + "') AND $creator = addr(" + CREATOR + ') ORDER BY at:u64 ASC';
}

async function readPage(query, offset) {
  const body = JSON.stringify({
    jsonrpc: '2.0',
    id: 1,
    method: 'arkiv_query',
    params: [query, {
      select: { key: true, creator: true, createdAt: true, creationFlags: true, attributes: true },
      limit: '0x' + PAGE_SIZE.toString(16),
      offset: '0x' + offset.toString(16),
    }],
  });
  return withTimeout(RPC_TIMEOUT_MS, async (signal) => {
    const response = await fetch(RPC_URL, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body,
      signal,
      credentials: 'omit',
    });
    if (response.status === 429) throw new ReadFailure(true, secondsToWait(response));
    if (!response.ok) throw new ReadFailure(false, 0);
    const answer = await response.json();
    const data = answer && answer.result && answer.result.data;
    if (!Array.isArray(data)) throw new ReadFailure(false, 0);
    return data;
  });
}

// A failed page fails the whole read. A part of the event must never pass for all of it.
async function readRows(query) {
  const rows = [];
  for (let page = 0; page < MAX_PAGES; page += 1) {
    const data = await readPage(query, page * PAGE_SIZE);
    rows.push(...data);
    if (data.length < PAGE_SIZE) return { rows, complete: true };
  }
  return { rows, complete: false };
}

function fieldsOf(row) {
  const fields = new Map();
  if (!Array.isArray(row.attributes)) return fields;
  for (const field of row.attributes) {
    if (field && typeof field.name === 'string' && !fields.has(field.name)) {
      fields.set(field.name, field);
    }
  }
  return fields;
}

function textField(fields, name) {
  const field = fields.get(name);
  return field && field.type === 'str' && typeof field.value === 'string' ? field.value : null;
}

function hexField(fields, name) {
  const value = textField(fields, name);
  return value !== null && HEX_64.test(value) ? value.toLowerCase() : null;
}

function nameField(fields, name) {
  const value = textField(fields, name);
  return value !== null && value.length <= NAME_MAX && NAME.test(value) ? value : null;
}

// The field may be typed as text or as an address, so the check is on the value alone.
function addressField(fields, name) {
  const field = fields.get(name);
  return field && typeof field.value === 'string' && ADDRESS.test(field.value) ? field.value : null;
}

// The node returns the flags as an object or as a raw byte, whose lowest bit means read-only.
function createdReadOnly(flags) {
  if (typeof flags === 'number') return (flags & 1) === 1;
  return Boolean(flags) && flags.readonly === true;
}

function blockOf(row) {
  const block = typeof row.createdAt === 'string' ? parseInt(row.createdAt, 16) : NaN;
  return Number.isNaN(block) ? Infinity : block;
}

// Only rows our wallet created as read-only are believed.
function believable(row) {
  if (!row || typeof row !== 'object') return false;
  if (typeof row.creator !== 'string' || row.creator.toLowerCase() !== CREATOR.toLowerCase()) return false;
  return createdReadOnly(row.creationFlags);
}

function placeOf(row, fields) {
  return {
    kind: textField(fields, 'arkiv.schema'),
    block: blockOf(row),
    key: typeof row.key === 'string' ? row.key : '',
  };
}

// An event name of the right form, or null.
function eventField(fields) {
  const value = textField(fields, 'event');
  return value !== null && EVENT_SLUG.test(value) ? value : null;
}

// One row of a kind, or null if it should not be believed.
function readRecord(row) {
  if (!believable(row)) return null;
  const fields = fieldsOf(row);
  const place = placeOf(row, fields);
  const hash = hexField(fields, 'hash');
  const pass = textField(fields, 'pass');
  const event = eventField(fields);
  if (place.kind !== RECORD_KIND || !hash || !pass || !event) return null;
  return { ...place, hash, pass, event, userName: nameField(fields, 'name') };
}

function readPointer(row) {
  if (!believable(row)) return null;
  const fields = fieldsOf(row);
  const place = placeOf(row, fields);
  const hash = hexField(fields, 'hash');
  const ref = hexField(fields, 'ref');
  const sha256 = hexField(fields, 'sha256');
  if (place.kind !== POINTER_KIND || !hash || !ref || !sha256) return null;
  return { ...place, hash, event: eventField(fields), ref, sha256 };
}

function readImageName(row) {
  if (!believable(row)) return null;
  const fields = fieldsOf(row);
  const place = placeOf(row, fields);
  const hash = hexField(fields, 'hash');
  const imageName = nameField(fields, 'name');
  if (place.kind !== IMAGE_NAME_KIND || !hash || !imageName) return null;
  return { ...place, hash, event: eventField(fields), imageName };
}

function readUser(row) {
  if (!believable(row)) return null;
  const fields = fieldsOf(row);
  const place = placeOf(row, fields);
  const pass = textField(fields, 'pass');
  if (place.kind !== USER_KIND || !pass) return null;
  const name = nameField(fields, 'name');
  const label = textField(fields, 'label');
  return {
    ...place,
    pass,
    name,
    label: label !== null && label.length <= LABEL_MAX && LABEL.test(label) ? label : (name ? name.split('.')[0] : null),
    address: addressField(fields, 'address'),
  };
}

function byCreation(a, b) {
  if (a.block !== b.block) return a.block < b.block ? -1 : 1;
  if (a.key !== b.key) return a.key < b.key ? -1 : 1;
  return 0;
}

// If one key has several rows, the first created one stands.
function firstOfEach(rows, keyOf) {
  const kept = new Map();
  for (const row of [...rows].sort(byCreation)) {
    if (!kept.has(keyOf(row))) kept.set(keyOf(row), row);
  }
  return kept;
}

// A pointer or an image name counts only for the event of its record, when it names one.
function ofRecord(rows, record) {
  return rows.get(record.event + '/' + record.hash) || rows.get('/' + record.hash) || null;
}

// A photo with no user name behind it. Each such photo has its own pass, so passes alone must not count as people.
const UNNAMED = { pass: null, label: 'unnamed', name: null, address: null, owner: null, unnamed: true };

// The whole tree's data. One photo per seal, oldest first, under its own record's event.
// A pointer with no record has no person behind it, so it is not shown.
function toModel(records, pointers, imageNames, users) {
  const placeKey = (row) => (row.event || '') + '/' + row.hash;
  const pointerOf = firstOfEach(pointers, placeKey);
  const imageNameOf = firstOfEach(imageNames, placeKey);
  const people = new Map();
  const ownerOf = (address, pass) => (address ? address.toLowerCase() : 'pass:' + pass);
  const named = [];
  const heldLabels = new Set();
  for (const user of firstOfEach(users, (row) => row.pass).values()) {
    if (!user.label || heldLabels.has(user.label)) continue;
    heldLabels.add(user.label);
    const person = { pass: user.pass, label: user.label, name: user.name, address: user.address, owner: ownerOf(user.address, user.pass) };
    people.set(user.pass, person);
    if (!user.label.startsWith(TRIAL_EVENT)) named.push(person);
  }
  const events = new Map();
  for (const record of firstOfEach(records, (row) => row.hash).values()) {
    if (!people.has(record.pass) && record.userName) {
      const person = {
        pass: record.pass,
        label: record.userName.split('.')[0],
        name: record.userName,
        address: null,
        owner: ownerOf(null, record.pass),
      };
      people.set(record.pass, person);
      // A name seen only on a photo is listed too, unless it or its event is a trial.
      if (LABEL.test(person.label) && !heldLabels.has(person.label)
        && !person.label.startsWith(TRIAL_EVENT) && !record.event.startsWith(TRIAL_EVENT)) {
        heldLabels.add(person.label);
        named.push(person);
      }
    }
    const imageName = ofRecord(imageNameOf, record);
    const photo = {
      record,
      person: people.get(record.pass) || UNNAMED,
      pointer: ofRecord(pointerOf, record),
      imageName: imageName ? imageName.imageName : null,
    };
    if (!events.has(record.event)) events.set(record.event, []);
    events.get(record.event).push(photo);
  }
  return { named, events };
}

// People are counted only by name. A photo with no name is said to be unnamed.
function countLine(photos, complete) {
  const named = photos.filter((photo) => !photo.person.unnamed);
  const people = new Set(named.map((photo) => photo.person.pass)).size;
  const others = photos.length - named.length;
  let line = photos.length + (photos.length === 1 ? ' photo' : ' photos');
  // With the people not read yet, the line says nothing about them.
  if (rows.users && people > 0) line += ' from ' + people + (people === 1 ? ' person' : ' people');
  if (rows.users && others > 0) line += people > 0 ? ', ' + others + ' unnamed' : ', unnamed';
  return complete ? line : 'At least ' + line;
}

async function sha256Hex(bytes) {
  // Browsers leave this out on a page that is not served over https.
  if (!window.crypto || !window.crypto.subtle) return null;
  const digest = await window.crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');
}

// The type comes from the file's first bytes, never from a gateway. Anything else is not shown.
function pictureType(bytes) {
  const b = new Uint8Array(bytes.slice(0, 12));
  const starts = (...head) => head.every((value, i) => b[i] === value);
  if (starts(0xff, 0xd8, 0xff)) return 'image/jpeg';
  if (starts(0x89, 0x50, 0x4e, 0x47)) return 'image/png';
  const webp = [0x57, 0x45, 0x42, 0x50].every((value, i) => b[8 + i] === value);
  if (starts(0x52, 0x49, 0x46, 0x46) && webp) return 'image/webp';
  return null;
}

async function fetchPicture(url) {
  return withTimeout(PICTURE_TIMEOUT_MS, async (signal) => {
    const response = await fetch(url, { signal, credentials: 'omit' });
    if (!response.ok) throw new Error('The gateway refused.');
    return response.arrayBuffer();
  });
}

// A gateway is not trusted. If its bytes differ from the record, the next gateway gets its turn.
async function loadPicture(pointer) {
  let differing = null;
  for (const gateway of PICTURE_GATEWAYS) {
    let bytes;
    try {
      bytes = await fetchPicture(gateway + pointer.ref + '/');
    } catch {
      continue;
    }
    const type = pictureType(bytes);
    const digest = await sha256Hex(bytes);
    if (digest === null) return { state: 'unchecked', bytes, type };
    if (digest === pointer.sha256) return { state: 'same', bytes, type };
    if (!differing) differing = { state: 'differs', bytes, type };
  }
  return differing || { state: 'unreachable' };
}

// A name like image1 shows as i1.
function shortImage(name) {
  if (!name) return null;
  const first = name.split('.')[0];
  const number = /^image(\d+)$/.exec(first);
  return number ? 'i' + number[1] : first;
}

function shortAddress(address) {
  return address.slice(0, 6) + '…' + address.slice(-4);
}

function button(className, text, onClick) {
  const node = make('button', className, text);
  node.type = 'button';
  node.addEventListener('click', onClick);
  return node;
}

// Everything that lights up together, and the names to list, for each owner.
let lightable = [];
let namesOf = new Map();
let litOwner = null;
let litPerson = null;

function addName(owner, text) {
  if (!namesOf.has(owner)) namesOf.set(owner, []);
  if (!namesOf.get(owner).includes(text)) namesOf.get(owner).push(text);
}

function lightsWith(node, person) {
  if (person.owner) lightable.push({ node, owner: person.owner });
  return node;
}

function paintLit() {
  lightable = lightable.filter(({ node }) => node.isConnected);
  document.body.classList.toggle('lighting', litOwner !== null);
  for (const { node, owner } of lightable) node.classList.toggle('lit', owner === litOwner);
}

function paintMany() {
  ui.many.replaceChildren();
  ui.many.hidden = litOwner === null;
  if (litOwner === null) return;
  const person = litPerson;
  const names = namesOf.get(person.owner) || [];
  const one = person.address ? 'address' : 'person';
  const close = button('close', '×', () => light(null));
  close.setAttribute('aria-label', 'Close');
  ui.many.append(
    close,
    make('p', 'many-names', names.length ? names.join(', ') : person.label),
    make('p', 'many-arrow', '↓'),
    make('span', 'many-one', person.address || person.label),
    make('p', 'many-line', (names.length > 1 ? 'Many names, one ' : 'One name, one ') + one),
    make('p', 'many-records', 'By our records'),
  );
}

// Tapping a person or an address shows every name of theirs, and tapping again clears it.
function light(person) {
  const clearing = person === null || litOwner === person.owner;
  litOwner = clearing ? null : person.owner;
  litPerson = clearing ? null : person;
  paintLit();
  paintMany();
}

// The arrow from a name to its address. A person with no address yet points to their own label.
function toOwner(person) {
  if (person.unnamed) return make('span', 'to unnamed', rows.users ? 'unnamed' : 'not read yet');
  const node = button('to', '→ ' + (person.address ? shortAddress(person.address) : person.label), () => light(person));
  node.setAttribute('aria-label', person.address ? 'Address ' + person.address + ', by our records' : 'Person ' + person.label);
  return lightsWith(node, person);
}

function fact(list, title, value, className) {
  const dd = make('dd', className || '');
  if (typeof value === 'string') dd.textContent = value;
  else dd.append(value);
  list.append(make('dt', '', title), dd);
}

async function fillFrame(photo, frame, note, label) {
  if (!photo.pointer) {
    note.textContent = rows.pointers ? 'No picture on record.' : 'Not read yet.';
    return;
  }
  const picture = await loadPicture(photo.pointer);
  if (picture.state === 'unreachable') {
    note.textContent = 'This picture cannot be reached just now.';
    return;
  }
  const markIt = (text, title, className) => {
    const mark = make('span', 'mark ' + className, text);
    mark.title = title;
    frame.after(mark);
  };
  if (picture.state === 'differs') markIt('Differs from its record', "This picture's hash is not the one in its record.", 'differs');
  if (picture.state === 'unchecked') markIt('Not checked', "This browser could not check the picture's hash.", 'unchecked');
  const cannotShow = 'This file cannot be shown as a picture.';
  if (!picture.type) {
    note.textContent = cannotShow;
    return;
  }
  const image = document.createElement('img');
  image.alt = label;
  image.decoding = 'async';
  image.addEventListener('load', () => {
    frame.classList.add('shown');
    frame.replaceChildren(image);
  });
  image.addEventListener('error', () => {
    note.textContent = cannotShow;
  });
  image.src = URL.createObjectURL(new Blob([picture.bytes], { type: picture.type }));
}

function loadedFrame(photo, label) {
  const note = make('p', 'note', 'Loading picture…');
  const frame = make('div', 'frame');
  frame.append(note);
  fillFrame(photo, frame, note, label).catch(() => {
    note.textContent = 'This picture cannot be reached just now.';
  });
  return frame;
}

function factsOf(photo) {
  const facts = make('dl', 'facts');
  if (photo.imageName) fact(facts, 'Name', photo.imageName, 'code');
  if (onChain.has(photo.imageName)) fact(facts, 'ENS', 'On chain, read from mainnet');
  fact(facts, 'Seal hash', photo.record.hash, 'code');
  if (photo.person.unnamed) fact(facts, 'Person', rows.users ? 'unnamed' : 'not read yet');
  else fact(facts, 'Person', lightsWith(button('name', photo.person.label, () => light(photo.person)), photo.person));
  if (photo.person.address) fact(facts, 'Address, by our records', photo.person.address, 'code');
  return facts;
}

const labelOf = (state) => state.photo.imageName || 'Photo ' + state.position;
const signOf = (photo) => [photo.imageName, onChain.has(photo.imageName), photo.person.label, photo.person.address, photo.pointer && photo.pointer.ref,
  Boolean(rows.users), Boolean(rows.pointers), Boolean(rows.names)].join('|');

// One image's row. The picture from Swarm, its seal hash and its person open under it, and load only when first opened.
function drawImageRow(state) {
  const { photo, item } = state;
  const short = shortImage(photo.imageName);
  // In a person's list the same short name can come from two events, so the event is said.
  const place = state.withEvent ? ' · ' + photo.record.event : '';
  const open = button('name' + (short ? '' : ' none'), (short || (rows.names ? 'No name yet' : 'Not read yet')) + place, () => {
    let panel = item.querySelector('.panel');
    if (!panel) {
      panel = make('div', 'panel');
      panel.append(loadedFrame(state.photo, labelOf(state)), factsOf(state.photo));
      item.append(panel);
    } else {
      panel.hidden = !panel.hidden;
    }
    open.setAttribute('aria-expanded', String(!panel.hidden));
    paintLit();
  });
  const panelNow = item.querySelector('.panel');
  open.setAttribute('aria-expanded', String(Boolean(panelNow && !panelNow.hidden)));
  const row = make('div', 'row');
  row.append(lightsWith(open, photo.person));
  if (onChain.has(photo.imageName)) row.append(make('span', 'chain', 'on chain'));
  row.append(toOwner(photo.person));
  const old = item.querySelector('.row');
  if (old) old.replaceWith(row);
  else item.append(row);
}

// Something about this image changed, such as its name arriving. What is open stays open.
function updateImage(state, photo) {
  const hadPicture = Boolean(state.photo.pointer);
  state.photo = photo;
  state.sign = signOf(photo);
  drawImageRow(state);
  const panel = state.item.querySelector('.panel');
  if (!panel) return;
  panel.querySelector('.facts').replaceWith(factsOf(photo));
  if (!hadPicture) {
    panel.querySelectorAll('.mark').forEach((mark) => mark.remove());
    panel.querySelector('.frame').replaceWith(loadedFrame(photo, labelOf(state)));
  }
}

// One list for each event seen, kept, so an open picture stays open while the tree updates.
const eventViews = new Map();
const personViews = new Map();
let currentEvent = null;
let currentPerson = null;

function updateView(views, key, photos, withEvent) {
  let view = views.get(key);
  const first = !view;
  if (first) {
    view = { list: make('ul', 'branch'), states: new Map() };
    views.set(key, view);
  }
  photos.forEach((photo, index) => {
    const known = view.states.get(photo.record.hash);
    if (known) {
      if (known.sign !== signOf(photo)) updateImage(known, photo);
      return;
    }
    const state = { photo, position: index + 1, sign: signOf(photo), item: make('li', first ? '' : 'fresh'), withEvent };
    drawImageRow(state);
    view.states.set(photo.record.hash, state);
    view.list.append(state.item);
  });
  return view;
}

const updateEventView = (slug, photos) => updateView(eventViews, slug, photos, false);
const photosOfPerson = (person) => [...latest.events.values()].flat().filter((photo) => photo.person.owner === person.owner);

function updatePersonView(person) {
  const photos = photosOfPerson(person);
  const view = updateView(personViews, person.owner, photos, true);
  if (!view.none) view.none = make('p', 'note', 'No photos yet.');
  view.none.hidden = photos.length > 0;
  return view;
}

// The entry now open on either branch.
function selectEntry(entry) {
  for (const other of ui.tree.querySelectorAll('button.entry')) other.setAttribute('aria-current', String(other === entry));
}

// One entry on a branch. A name with no record is plain text and cannot be tapped, so it never looks real.
function absentEntry(label, word) {
  const item = make('li', '');
  const entry = make('div', 'entry absent');
  entry.append(make('span', 'entry-name', label), make('span', 'entry-sub', word));
  item.append(entry);
  return item;
}

function realEntry(label, sub, subClass, onClick) {
  const entry = button('entry', '', onClick);
  entry.append(make('span', 'entry-name', label), make('span', 'entry-sub ' + subClass, sub));
  return entry;
}

function usersLimb(people, known) {
  const limb = make('section', 'limb');
  limb.append(make('h2', '', 'Users'));
  if (people.some((person) => person.address)) limb.append(make('p', 'caption', 'Addresses by our records'));
  const list = make('ul', 'branch');
  const labels = [...USERS, ...people.map((person) => person.label).filter((label) => !USERS.includes(label))];
  for (const label of labels) {
    const person = people.find((one) => one.label === label);
    if (!person) {
      list.append(absentEntry(label, known ? 'not yet' : 'not read'));
      continue;
    }
    const marked = onChain.has(person.name);
    const sub = (person.address ? shortAddress(person.address) : 'no address yet') + (marked ? ' · on chain' : '');
    const entry = realEntry(label, sub, person.address ? 'code' : '', () => {
      selectEntry(entry);
      openPerson(person);
    });
    entry.setAttribute('aria-current', String(Boolean(currentPerson) && currentPerson.owner === person.owner));
    if (person.address) entry.setAttribute('aria-label', label + ', address ' + person.address + ', by our records' + (marked ? ', on chain' : ''));
    const item = make('li', '');
    item.append(lightsWith(entry, person));
    list.append(item);
  }
  limb.append(list);
  return limb;
}

function eventsLimb(events, complete) {
  const limb = make('section', 'limb');
  limb.append(make('h2', '', 'Events'));
  const list = make('ul', 'branch');
  const slugs = [...EVENTS, ...[...events.keys()].filter((slug) => !EVENTS.includes(slug))];
  for (const slug of slugs) {
    const photos = events.get(slug);
    if (!photos || photos.length === 0) {
      list.append(absentEntry(slug, 'not yet'));
      continue;
    }
    // A picture's name on chain means its event's name is on chain too.
    const marked = photos.some((photo) => onChain.has(photo.imageName));
    const entry = realEntry(slug, countLine(photos, complete) + (marked ? ' · on chain' : ''), '', () => {
      selectEntry(entry);
      openEvent(slug);
    });
    entry.setAttribute('aria-current', String(!currentPerson && slug === currentEvent));
    const item = make('li', '');
    item.append(entry);
    list.append(item);
  }
  limb.append(list);
  return limb;
}

// The "on chain" mark asks ENS on mainnet, from this browser, through the Universal Resolver.
// It only ever adds a mark. If it cannot read, the page stays as it is and says nothing.
const ENS_RPC_URL = 'https://ethereum-rpc.publicnode.com';
const UNIVERSAL_RESOLVER = '0xeeeeeeee14d718c2b47d9923deab1335e144eeee';
const ENS_TIMEOUT_MS = 10000;
const ENS_NAMES_AT_ONCE = 24;
const ENS_ASK_AGAIN_MS = 120000;
const ENS_AFTER_TROUBLE_MS = 300000;
// The known hash of the name "eth". If our hash does not give it, no mark is ever shown.
const ETH_NODE = '93cdeb708b7545dc668eb9280176169d1c33cfd8ed6f04690a0bcc88a93fc4ae';

// Keccak-256, which ENS hashes names with. Browsers do not have it.
const KECCAK_ROUNDS = [0x1n, 0x8082n, 0x800000000000808an, 0x8000000080008000n, 0x808bn, 0x80000001n, 0x8000000080008081n, 0x8000000000008009n,
  0x8an, 0x88n, 0x80008009n, 0x8000000an, 0x8000808bn, 0x800000000000008bn, 0x8000000000008089n, 0x8000000000008003n,
  0x8000000000008002n, 0x8000000000000080n, 0x800an, 0x800000008000000an, 0x8000000080008081n, 0x8000000000008080n, 0x80000001n, 0x8000000080008008n];
const KECCAK_TURNS = [1, 3, 6, 10, 15, 21, 28, 36, 45, 55, 2, 14, 27, 41, 56, 8, 25, 43, 62, 18, 39, 61, 20, 44];
const KECCAK_PLACES = [10, 7, 11, 17, 18, 3, 5, 16, 8, 21, 24, 4, 15, 23, 19, 13, 12, 2, 20, 14, 22, 9, 6, 1];
const LANE = (1n << 64n) - 1n;
const turned = (lane, by) => ((lane << BigInt(by)) | (lane >> BigInt(64 - by))) & LANE;

function keccakRounds(state) {
  const column = new Array(5);
  for (const round of KECCAK_ROUNDS) {
    for (let i = 0; i < 5; i += 1) column[i] = state[i] ^ state[i + 5] ^ state[i + 10] ^ state[i + 15] ^ state[i + 20];
    for (let i = 0; i < 5; i += 1) {
      const mix = column[(i + 4) % 5] ^ turned(column[(i + 1) % 5], 1);
      for (let j = 0; j < 25; j += 5) state[j + i] ^= mix;
    }
    let moving = state[1];
    KECCAK_PLACES.forEach((place, i) => {
      const next = state[place];
      state[place] = turned(moving, KECCAK_TURNS[i]);
      moving = next;
    });
    for (let j = 0; j < 25; j += 5) {
      for (let i = 0; i < 5; i += 1) column[i] = state[j + i];
      for (let i = 0; i < 5; i += 1) state[j + i] ^= (column[(i + 1) % 5] ^ LANE) & column[(i + 2) % 5];
    }
    state[0] ^= round;
  }
}

function keccak256(bytes) {
  const rate = 136;
  const padded = new Uint8Array((Math.floor(bytes.length / rate) + 1) * rate);
  padded.set(bytes);
  padded[bytes.length] ^= 0x01;
  padded[padded.length - 1] ^= 0x80;
  const state = new Array(25).fill(0n);
  for (let start = 0; start < padded.length; start += rate) {
    for (let lane = 0; lane < rate / 8; lane += 1) {
      let value = 0n;
      for (let b = 7; b >= 0; b -= 1) value = (value << 8n) | BigInt(padded[start + lane * 8 + b]);
      state[lane] ^= value;
    }
    keccakRounds(state);
  }
  const out = new Uint8Array(32);
  for (let i = 0; i < 32; i += 1) out[i] = Number((state[i >> 3] >> BigInt((i & 7) * 8)) & 0xffn);
  return out;
}

const utf8 = (text) => new TextEncoder().encode(text);
const hexOf = (bytes) => Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('');
const word = (number) => number.toString(16).padStart(64, '0');
const withLength = (hex) => word(hex.length / 2) + hex + '0'.repeat((64 - (hex.length % 64)) % 64);

function nameNode(name) {
  let node = new Uint8Array(32);
  for (const label of name.split('.').reverse()) {
    const joined = new Uint8Array(64);
    joined.set(node);
    joined.set(keccak256(utf8(label)), 32);
    node = keccak256(joined);
  }
  return hexOf(node);
}

// The name as ENS sends it: each label after its length. Null if a label cannot be sent.
function dnsName(name) {
  let hex = '';
  for (const label of name.split('.')) {
    const bytes = utf8(label);
    if (bytes.length === 0 || bytes.length > 255) return null;
    hex += bytes.length.toString(16).padStart(2, '0') + hexOf(bytes);
  }
  return hex + '00';
}

// The bytes at one place in an answer, or null if they are not there.
function bytesAt(hex, place) {
  const start = parseInt(hex.slice(place * 64, place * 64 + 64), 16) * 2;
  const length = parseInt(hex.slice(start, start + 64), 16) * 2;
  if (Number.isNaN(start) || Number.isNaN(length) || start + 64 + length > hex.length) return null;
  return hex.slice(start + 64, start + 64 + length);
}

// One question to the Universal Resolver: resolve(bytes name, bytes data). A name that does not resolve gives null. A failed read throws.
async function askEns(name, question) {
  const dns = dnsName(name);
  if (dns === null) return null;
  const first = withLength(dns);
  const body = JSON.stringify({
    jsonrpc: '2.0',
    id: 1,
    method: 'eth_call',
    params: [{ to: UNIVERSAL_RESOLVER, data: '0x9061b923' + word(64) + word(64 + first.length / 2) + first + withLength(question) }, 'latest'],
  });
  return withTimeout(ENS_TIMEOUT_MS, async (signal) => {
    const response = await fetch(ENS_RPC_URL, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body,
      signal,
      credentials: 'omit',
    });
    if (!response.ok) throw new Error('ENS could not be read.');
    const answer = await response.json();
    if (answer && answer.error) return null;
    if (!answer || typeof answer.result !== 'string') throw new Error('ENS could not be read.');
    const out = bytesAt(answer.result.slice(2), 0);
    return out === null ? null : bytesAt(out, 0);
  });
}

// A name that was never registered can still answer through its parent's resolver, so only the exact record counts:
// a person's address, or a picture's seal hash under the root's own key.
async function nameHolds(check) {
  const node = nameNode(check.name);
  if (check.seal) {
    const key = check.name.split('.').slice(-2).reverse().join('.') + '.seal';
    const found = await askEns(check.name, '59d1d43c' + node + word(64) + withLength(hexOf(utf8(key))));
    return found === hexOf(utf8(check.seal));
  }
  const found = await askEns(check.name, 'f1cb7e06' + node + word(60));
  if (found === null || found.length !== 40 || /^0+$/.test(found)) return false;
  return !check.address || found === check.address.slice(2).toLowerCase();
}

const onChain = new Set();
const ensAsked = new Map();
let ensBusy = false;
let ensPausedUntil = 0;
let ensHashIsRight = null;

// Asks about names not yet marked, one at a time. A failed read waits, and nothing shows.
async function readMarks(checks, linked) {
  if (ensBusy || Date.now() < ensPausedUntil) return;
  if (ensHashIsRight === null) ensHashIsRight = nameNode('eth') === ETH_NODE;
  if (!ensHashIsRight) return;
  const now = Date.now();
  const due = checks.filter((check) => !onChain.has(check.name) && now - (ensAsked.get(check.name) || 0) >= ENS_ASK_AGAIN_MS).slice(0, ENS_NAMES_AT_ONCE);
  if (due.length === 0) return;
  ensBusy = true;
  let found = false;
  try {
    for (const check of due) {
      ensAsked.set(check.name, Date.now());
      if (await nameHolds(check)) {
        onChain.add(check.name);
        found = true;
      }
    }
  } catch {
    ensPausedUntil = Date.now() + ENS_AFTER_TROUBLE_MS;
  } finally {
    ensBusy = false;
  }
  if (found) draw(linked);
}

// What was last read and drawn.
const rows = { records: null, pointers: null, names: null, users: null };
let latest = null;
let limbsSign = null;

function showCount() {
  const photos = currentPerson ? photosOfPerson(currentPerson) : latest.events.get(currentEvent) || [];
  ui.count.textContent = photos.length ? countLine(photos, latest.complete) : '';
  ui.event.textContent = currentPerson ? currentPerson.label : currentEvent;
}

// The event on top, and its images under the tree.
function openEvent(slug) {
  currentEvent = slug;
  currentPerson = null;
  showCount();
  const view = updateEventView(slug, latest.events.get(slug) || []);
  ui.images.replaceChildren(make('h2', '', slug), view.list);
  ui.images.hidden = false;
  paintLit();
}

// A person's images, from every event, in the same place.
function openPerson(person) {
  if (litOwner !== null) light(null);
  currentPerson = person;
  currentEvent = null;
  showCount();
  const view = updatePersonView(person);
  ui.images.replaceChildren(make('h2', '', person.label), view.none, view.list);
  ui.images.hidden = false;
  paintLit();
}

function showFailure(failure) {
  const busy = failure instanceof ReadFailure && failure.busy;
  setState(
    busy
      ? 'The records service has too many requests just now. Wait a moment and try again.'
      : 'The records cannot be read just now. Try again in a moment.',
    'bad',
  );
  ui.retry.hidden = false;
  if (busy) {
    ui.retry.disabled = true;
    setTimeout(() => { ui.retry.disabled = false; }, failure.waitSeconds * 1000);
  } else {
    ui.retry.disabled = false;
  }
}

// Draws what was read. Nothing is taken down, so what is open stays open and the scroll stays where it is.
function draw(linked) {
  const rowsOf = (read, reader) => (read ? read.rows.map(reader).filter(Boolean) : []);
  const model = toModel(
    rowsOf(rows.records, readRecord),
    rowsOf(rows.pointers, readPointer),
    rowsOf(rows.names, readImageName),
    rowsOf(rows.users, readUser),
  );
  // The listed events, and any other event found in a real row. A trial shows only if the link or the name asks for it.
  const sealEvent = sealWatch && sealWatch.record ? sealWatch.record.event : null;
  const events = new Map([...model.events].filter(([slug]) => !slug.startsWith(TRIAL_EVENT) || slug === linked || slug === sealEvent));
  latest = { events, complete: rows.records.complete };
  if (currentPerson) currentPerson = model.named.find((person) => person.owner === currentPerson.owner) || currentPerson;
  namesOf = new Map();
  for (const person of model.named) addName(person.owner, person.label);
  for (const photos of events.values()) {
    for (const photo of photos) {
      if (!photo.person.unnamed) addName(photo.person.owner, shortImage(photo.imageName) || 'Photo');
    }
  }
  if (!ui.tree.firstChild) ui.tree.append(make('div', 'root', ROOT_SHOWN), make('div', 'split'));
  // The two branches are redrawn only when what they say has changed.
  const sign = JSON.stringify([
    rows.users !== null,
    model.named.map((person) => [person.label, person.address]),
    [...events].map(([slug, photos]) => [slug, countLine(photos, latest.complete)]),
    currentEvent,
    currentPerson && currentPerson.owner,
    onChain.size,
  ]);
  if (sign !== limbsSign) {
    limbsSign = sign;
    ui.tree.querySelector('.split').replaceChildren(usersLimb(model.named, rows.users !== null), eventsLimb(events, latest.complete));
  }
  for (const [slug, view] of eventViews) {
    if (view) updateEventView(slug, events.get(slug) || []);
  }
  for (const person of model.named) {
    if (personViews.has(person.owner)) updatePersonView(person);
  }
  const sealSlug = sealEventToOpen(events);
  if (sealSlug) {
    openEvent(sealSlug);
    limbsSign = null;
    ui.tree.querySelector('.split').replaceChildren(usersLimb(model.named, rows.users !== null), eventsLimb(events, latest.complete));
  }
  if (currentEvent || currentPerson) {
    showCount();
  } else {
    const withPhotos = [...EVENTS, ...events.keys()].filter((slug) => (events.get(slug) || []).length > 0);
    const first = linked && (events.get(linked) || []).length > 0 ? linked : withPhotos[0];
    if (first) {
      openEvent(first);
      limbsSign = null;
      ui.tree.querySelector('.split').replaceChildren(usersLimb(model.named, rows.users !== null), eventsLimb(events, latest.complete));
    }
  }
  paintLit();
  paintMany();
  markSealRow();
  paintSealWatch();
  const checks = [];
  for (const person of model.named) {
    if (person.name) checks.push({ name: person.name, address: person.address });
  }
  for (const photos of events.values()) {
    for (const photo of photos) {
      if (photo.imageName) checks.push({ name: photo.imageName, seal: photo.record.hash });
    }
  }
  readMarks(checks, linked).catch(() => {});
}

let reading = false;
let nextAllowed = 0;
let timer = null;

// Reads all four kinds. A kind that fails keeps what it last had, and nothing flashes.
async function readAll() {
  const kinds = { records: RECORD_KIND, pointers: POINTER_KIND, names: IMAGE_NAME_KIND, users: USER_KIND };
  let failure = null;
  await Promise.all(Object.entries(kinds).map(async ([key, kind]) => {
    try {
      rows[key] = await readRows(kindQuery(kind));
    } catch (problem) {
      failure = failure || problem;
    }
  }));
  return failure;
}

async function refresh(linked) {
  if (reading) return;
  reading = true;
  clearTimeout(timer);
  let trouble = true;
  try {
    const failure = await readAll();
    trouble = failure !== null;
    if (rows.records) {
      ui.retry.hidden = true;
      if (rows.pointers && rows.names && rows.users) clearState();
      else setState('Some names or pictures could not be read just now.', 'plain');
      draw(linked);
    } else {
      // Only a page with nothing to show says so.
      showFailure(failure);
    }
  } catch {
    trouble = true;
  } finally {
    reading = false;
    const wait = trouble ? READ_AFTER_TROUBLE_MS : READ_EVERY_MS;
    nextAllowed = Date.now() + (trouble ? READ_AFTER_TROUBLE_MS : FOCUS_GAP_MS);
    timer = setTimeout(() => {
      if (document.hidden) timer = setTimeout(() => refresh(linked), READ_EVERY_MS);
      else refresh(linked);
    }, wait);
  }
}

// A link to one photo: this page with #seal=<hash>. The app opens it after Publish, and the person watches the photo go on chain.
const SEAL_READ_EVERY_MS = 4000;
const SEAL_READ_AFTER_TROUBLE_MS = 10000;
const SEAL_PICTURE_AGAIN_MS = 10000;
const SEAL_GIVE_UP_MS = 600000;
const PICTURE_NOT_REACHED = 'This picture cannot be reached just now.';
let sealWatch = null;
let pageLinked = null;

// A record of this seal, with or without an event. A photo with no event still has a state to show.
function readSealRecord(row) {
  if (!believable(row)) return null;
  const fields = fieldsOf(row);
  const place = placeOf(row, fields);
  const hash = hexField(fields, 'hash');
  if (place.kind !== RECORD_KIND || !hash) return null;
  return { ...place, hash, event: eventField(fields), userName: nameField(fields, 'name') };
}

// Only this photo's rows. The hash is checked as 64 hex digits, so it cannot close the quoted string. Says if anything is new.
async function readSealRows(watch) {
  const read = await readRows("hash = str('" + watch.hash + "') AND $creator = addr(" + CREATOR + ') ORDER BY at:u64 ASC');
  const record = read.rows.map(readSealRecord).filter(Boolean)[0] || null;
  if (sealWatch !== watch || !record) return false;
  const ofEvent = (row) => row.hash === watch.hash && (!row.event || !record.event || row.event === record.event);
  const pointer = read.rows.map(readPointer).filter(Boolean).find(ofEvent) || null;
  const named = read.rows.map(readImageName).filter(Boolean).find(ofEvent) || null;
  const imageName = named ? named.imageName : null;
  const isNew = !watch.record || (pointer && !watch.pointer) || (imageName && !watch.imageName);
  watch.record = record;
  watch.pointer = pointer;
  watch.imageName = imageName;
  return Boolean(isNew);
}

const sealGetsNoName = (record) => !record.userName || !record.event;
const sealHasAllRows = (watch) => Boolean(watch.record && watch.pointer && (watch.imageName || sealGetsNoName(watch.record)));

function paintSealWatch() {
  const watch = sealWatch;
  if (!watch) return;
  const step = (node, finished, text) => {
    node.textContent = text;
    node.classList.toggle('done', finished);
  };
  step(watch.authorised, Boolean(watch.record), watch.record ? 'Authorised' : 'Waiting for its record');
  step(watch.swarm, Boolean(watch.pointer), watch.pointer ? 'Picture on Swarm' : 'Picture on Swarm: not yet');
  if (watch.imageName) {
    step(watch.chain, true, 'On chain as ' + watch.imageName + (onChain.has(watch.imageName) ? ', read from ENS' : ', by our records'));
  } else if (watch.record && sealGetsNoName(watch.record)) {
    step(watch.chain, false, 'No name: a name needs an event and a named person');
  } else {
    step(watch.chain, false, 'On chain: not yet');
  }
}

// The picture, once the pointer exists. A fresh upload can take a while to reach a gateway, so it is tried again.
function showSealPicture(watch) {
  if (!watch.pointer) return;
  const label = watch.imageName || 'This photo';
  if (!watch.frame) {
    watch.frame = loadedFrame({ pointer: watch.pointer }, label);
    watch.frameAt = Date.now();
    watch.box.append(watch.frame);
    return;
  }
  const note = watch.frame.querySelector('.note');
  if (!watch.frame.classList.contains('shown') && note && note.textContent === PICTURE_NOT_REACHED && Date.now() - watch.frameAt >= SEAL_PICTURE_AGAIN_MS) {
    const next = loadedFrame({ pointer: watch.pointer }, label);
    watch.frame.replaceWith(next);
    watch.frame = next;
    watch.frameAt = Date.now();
  }
}

function sealPictureSettled(watch) {
  if (!watch.frame) return false;
  if (watch.frame.classList.contains('shown')) return true;
  const note = watch.frame.querySelector('.note');
  return Boolean(note) && note.textContent !== PICTURE_NOT_REACHED && note.textContent !== 'Loading picture…';
}

// Asks about this photo until it is done, then stops. A failed read waits, and nothing shows.
async function watchSeal(watch) {
  const started = Date.now();
  while (sealWatch === watch) {
    let wait = SEAL_READ_EVERY_MS;
    if (!document.hidden && !sealHasAllRows(watch)) {
      try {
        // Something new also goes to the tree, so that the photo's row appears there.
        if (await readSealRows(watch)) refresh(pageLinked);
      } catch (problem) {
        wait = problem instanceof ReadFailure && problem.busy ? Math.max(problem.waitSeconds * 1000, wait) : SEAL_READ_AFTER_TROUBLE_MS;
      }
    }
    if (sealWatch !== watch) return;
    paintSealWatch();
    showSealPicture(watch);
    if (sealHasAllRows(watch) && sealPictureSettled(watch)) return;
    if (Date.now() - started >= SEAL_GIVE_UP_MS) {
      watch.note.hidden = false;
      return;
    }
    await new Promise((done) => { setTimeout(done, wait); });
  }
}

function sealEventToOpen(events) {
  const watch = sealWatch;
  if (!watch || watch.opened) return null;
  for (const [slug, photos] of events) {
    if (photos.some((photo) => photo.record.hash === watch.hash)) {
      watch.opened = true;
      return slug;
    }
  }
  return null;
}

function markSealRow() {
  if (!sealWatch) return;
  for (const view of eventViews.values()) {
    const state = view.states.get(sealWatch.hash);
    if (state) state.item.classList.add('seal-focus');
  }
}

function startSealWatch() {
  if (sealWatch) sealWatch.box.remove();
  sealWatch = null;
  document.querySelectorAll('.seal-focus').forEach((item) => item.classList.remove('seal-focus'));
  const found = /^#seal=([0-9a-fA-F]{64})$/.exec(window.location.hash);
  if (!found) return;
  const watch = {
    hash: found[1].toLowerCase(),
    box: make('section', 'seal-watch'),
    authorised: make('li', ''),
    swarm: make('li', ''),
    chain: make('li', ''),
    note: make('p', 'note', 'Not finished yet. Open this page again to check.'),
    record: null,
    pointer: null,
    imageName: null,
    frame: null,
    frameAt: 0,
    opened: false,
  };
  const steps = make('ul', 'seal-steps');
  steps.append(watch.authorised, watch.swarm, watch.chain);
  watch.note.hidden = true;
  watch.box.setAttribute('aria-live', 'polite');
  watch.box.append(make('h2', '', 'This photo'), steps, watch.note);
  ui.tree.before(watch.box);
  sealWatch = watch;
  paintSealWatch();
  watch.box.scrollIntoView({ block: 'start' });
  watchSeal(watch).catch(() => {});
}

function start() {
  const link = new URLSearchParams(window.location.search);
  // Every event's name points to this same page, so the event is read from the name that opened it: <event>.events.<root>.eth, through any gateway.
  const fromName = /^([a-z0-9-]+)\.events\.[a-z0-9-]+\.eth(\.|$)/.exec(window.location.hostname);
  const linked = link.has('event') ? link.get('event') : (fromName ? fromName[1] : null);
  if (linked !== null && !EVENT_SLUG.test(linked)) {
    setState('This link does not name an event.', 'bad');
    return;
  }
  ui.retry.addEventListener('click', () => {
    nextAllowed = 0;
    setState('Reading the records…', 'wait');
    ui.retry.hidden = true;
    refresh(linked);
  });
  const readNow = () => {
    if (!document.hidden && Date.now() >= nextAllowed) refresh(linked);
  };
  window.addEventListener('focus', readNow);
  document.addEventListener('visibilitychange', readNow);
  setState('Reading the records…', 'wait');
  pageLinked = linked;
  startSealWatch();
  window.addEventListener('hashchange', startSealWatch);
  refresh(linked);
}

start();
</script>
</body>
</html>
