<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e1626">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; connect-src https://rpc.rabdi.db-chain.testnet.arkiv.network https://download.gateway.ethswarm.org https://bzz.limo; base-uri 'none'; form-action 'none'">
<title>Event photos</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;
    --accent: #dcab64;
    --accent-soft: #2a2416;
    --bg: #0e1626;
    --surface: #152036;
    --ink: #edf0f6;
    --muted: #939bad;
    --line: #283349;
    --no: #ff9f92;
    --no-bg: #301614;
    --wait: #f2b46b;
    --wait-bg: #33261a;
    --text: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.45 var(--text);
  }
  main, footer {
    width: 100%;
    max-width: 1072px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  main { flex: 1; padding-top: 32px; padding-bottom: 32px; }
  header { margin-bottom: 24px; }
  h1 {
    margin: 0;
    font-size: 28px;
    line-height: 1.2;
    font-weight: 600;
    overflow-wrap: anywhere;
  }
  #count { margin: 8px 0 0; color: var(--accent); font-size: 17px; font-weight: 500; }
  #count:empty { display: none; }
  .state {
    margin: 0 0 16px;
    padding: 12px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
  }
  .state.wait { color: var(--wait); background: var(--wait-bg); }
  .state.bad { color: var(--no); background: var(--no-bg); }
  .state.plain { color: var(--ink); background: var(--surface); border: 1px solid var(--line); }
  button {
    display: block;
    width: 100%;
    max-width: 320px;
    min-height: 44px;
    margin: 0 0 16px;
    padding: 10px 16px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: var(--bg);
    font: 600 16px/1.2 var(--text);
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .person { margin-bottom: 32px; }
  .person:last-child { margin-bottom: 0; }
  .person h2 {
    margin: 0;
    font-size: 18px;
    line-height: 1.3;
    font-weight: 600;
    overflow-wrap: anywhere;
  }
  .address { margin: 4px 0 0; font: 400 13px/1.45 var(--mono); overflow-wrap: anywhere; }
  .owned { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .photos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
    gap: 16px;
    align-items: start;
    margin: 12px 0 0;
    padding: 0;
    list-style: none;
  }
  .card {
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
  }
  .frame {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    padding: 16px;
    background: var(--accent-soft);
  }
  .frame.shown { display: block; min-height: 0; padding: 0; background: none; }
  .frame img { display: block; width: 100%; height: auto; }
  .note { margin: 0; color: var(--muted); font-size: 14px; text-align: center; }
  .details { padding: 12px; }
  .details:empty { display: none; }
  .details p { margin: 0; overflow-wrap: anywhere; }
  .image-name { font: 400 13px/1.45 var(--mono); }
  .mark {
    display: inline-block;
    margin-top: 4px;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--wait);
    background: var(--wait-bg);
  }
  .mark.differs { color: var(--no); background: var(--no-bg); }
  .mark:first-child { margin-top: 0; }
  footer {
    padding-top: 16px;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    color: var(--muted);
    font-size: 12px;
  }
  footer p { margin: 0; padding-top: 16px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="event"></h1>
    <p id="count"></p>
  </header>
  <p id="state" class="state" role="status" hidden></p>
  <button id="retry" type="button" hidden>Try again</button>
  <noscript><p class="state bad">This page reads its records with JavaScript.</p></noscript>
  <div id="people"></div>
</main>
<footer>
  <p>A proven edit of a signed original (our test key in this demo). Covers are drawn by the app and not proved. Not a privacy guarantee. Records are written by our server. A name is a linkable pseudonym, not a real identity. In this demo our server holds the address keys and acts as the gate.</p>
</footer>
<script>
'use strict';

// The event shown when the link names none. A link can name another one with ?event=<slug>.
const DEFAULT_EVENT = 'mumbai-march';

const RPC_URL = 'https://rpc.rabdi.db-chain.testnet.arkiv.network';
// Anyone can write a row that looks like ours, so only rows this wallet created are believed.
const CREATOR = '0x37D7D1bDA05129eBCb6e99Aa4ae106e8B75088eB';
const PICTURE_GATEWAYS = ['https://download.gateway.ethswarm.org/bzz/', 'https://bzz.limo/bzz/'];
const RECORD_KIND = 'blank-demo.seals';
const POINTER_KIND = 'blank-demo.pictures';
const IMAGE_NAME_KIND = 'blank-demo.names';
const USER_KIND = 'blank-demo.users';

const PAGE_SIZE = 100;
const MAX_PAGES = 20;
const RPC_TIMEOUT_MS = 20000;
const PICTURE_TIMEOUT_MS = 30000;
const PICTURES_AT_ONCE = 3;

const EVENT_SLUG = /^[a-z0-9][a-z0-9-]{2,39}$/;
const HEX_64 = /^[0-9a-fA-F]{64}$/;
const ADDRESS = /^0x[0-9a-fA-F]{40}$/;
const NAME = /^[\p{L}\p{N}-]+(\.[\p{L}\p{N}-]+)+$/u;
const NAME_MAX = 128;

const ui = {
  event: document.getElementById('event'),
  count: document.getElementById('count'),
  state: document.getElementById('state'),
  retry: document.getElementById('retry'),
  people: document.getElementById('people'),
};

// All row text is untrusted. It reaches the page only through textContent, alt and validated hex.
function make(tag, className, text) {
  const node = document.createElement(tag);
  node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function setState(text, tone) {
  ui.state.textContent = text;
  ui.state.className = 'state ' + tone;
  ui.state.hidden = false;
}

function clearState() {
  ui.state.textContent = '';
  ui.state.hidden = true;
}

async function withTimeout(ms, work) {
  const control = new AbortController();
  const timer = setTimeout(() => control.abort(), ms);
  try {
    return await work(control.signal);
  } finally {
    clearTimeout(timer);
  }
}

class ReadFailure extends Error {
  constructor(busy, waitSeconds) {
    super('The records could not be read.');
    this.busy = busy;
    this.waitSeconds = waitSeconds;
  }
}

function secondsToWait(response) {
  const asked = parseInt(response.headers.get('retry-after') || '', 10);
  return Number.isNaN(asked) ? 5 : Math.min(Math.max(asked, 1), 60);
}

// The slug has passed EVENT_SLUG, so it cannot close the quoted string.
function eventQuery(slug) {
  return "event = str('" + slug + "') AND $creator = addr(" + CREATOR + ') ORDER BY at:u64 ASC';
}

function usersQuery() {
  return "arkiv.schema = str('" + USER_KIND + "') AND $creator = addr(" + CREATOR + ') ORDER BY at:u64 ASC';
}

async function readPage(query, offset) {
  const body = JSON.stringify({
    jsonrpc: '2.0',
    id: 1,
    method: 'arkiv_query',
    params: [query, {
      select: { key: true, creator: true, createdAt: true, creationFlags: true, attributes: true },
      limit: '0x' + PAGE_SIZE.toString(16),
      offset: '0x' + offset.toString(16),
    }],
  });
  return withTimeout(RPC_TIMEOUT_MS, async (signal) => {
    const response = await fetch(RPC_URL, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body,
      signal,
      credentials: 'omit',
    });
    if (response.status === 429) throw new ReadFailure(true, secondsToWait(response));
    if (!response.ok) throw new ReadFailure(false, 0);
    const answer = await response.json();
    const data = answer && answer.result && answer.result.data;
    if (!Array.isArray(data)) throw new ReadFailure(false, 0);
    return data;
  });
}

// A failed page fails the whole read. A part of the event must never pass for all of it.
async function readRows(query) {
  const rows = [];
  for (let page = 0; page < MAX_PAGES; page += 1) {
    const data = await readPage(query, page * PAGE_SIZE);
    rows.push(...data);
    if (data.length < PAGE_SIZE) return { rows, complete: true };
  }
  return { rows, complete: false };
}

function fieldsOf(row) {
  const fields = new Map();
  if (!Array.isArray(row.attributes)) return fields;
  for (const field of row.attributes) {
    if (field && typeof field.name === 'string' && !fields.has(field.name)) {
      fields.set(field.name, field);
    }
  }
  return fields;
}

function textField(fields, name) {
  const field = fields.get(name);
  return field && field.type === 'str' && typeof field.value === 'string' ? field.value : null;
}

function hexField(fields, name) {
  const value = textField(fields, name);
  return value !== null && HEX_64.test(value) ? value.toLowerCase() : null;
}

function nameField(fields, name) {
  const value = textField(fields, name);
  return value !== null && value.length <= NAME_MAX && NAME.test(value) ? value : null;
}

// The field may be typed as text or as an address, so the check is on the value alone.
function addressField(fields, name) {
  const field = fields.get(name);
  return field && typeof field.value === 'string' && ADDRESS.test(field.value) ? field.value : null;
}

// The node returns the flags as an object or as a raw byte, whose lowest bit means read-only.
function createdReadOnly(flags) {
  if (typeof flags === 'number') return (flags & 1) === 1;
  return Boolean(flags) && flags.readonly === true;
}

function blockOf(row) {
  const block = typeof row.createdAt === 'string' ? parseInt(row.createdAt, 16) : NaN;
  return Number.isNaN(block) ? Infinity : block;
}

// Only rows our wallet created as read-only are believed.
function believable(row) {
  if (!row || typeof row !== 'object') return false;
  if (typeof row.creator !== 'string' || row.creator.toLowerCase() !== CREATOR.toLowerCase()) return false;
  return createdReadOnly(row.creationFlags);
}

function placeOf(row, fields) {
  return {
    kind: textField(fields, 'arkiv.schema'),
    block: blockOf(row),
    key: typeof row.key === 'string' ? row.key : '',
  };
}

// One event row as a record, a pointer or an image name, or null if it should not be believed.
function readEventRow(row, slug) {
  if (!believable(row)) return null;
  const fields = fieldsOf(row);
  if (textField(fields, 'event') !== slug) return null;
  const hash = hexField(fields, 'hash');
  if (!hash) return null;
  const place = { ...placeOf(row, fields), hash };
  if (place.kind === RECORD_KIND) {
    const pass = textField(fields, 'pass');
    if (!pass) return null;
    return { ...place, pass, userName: nameField(fields, 'name') };
  }
  if (place.kind === POINTER_KIND) {
    const ref = hexField(fields, 'ref');
    const sha256 = hexField(fields, 'sha256');
    if (!ref || !sha256) return null;
    return { ...place, ref, sha256 };
  }
  if (place.kind === IMAGE_NAME_KIND) {
    const imageName = nameField(fields, 'name');
    return imageName ? { ...place, imageName } : null;
  }
  return null;
}

function readUserRow(row) {
  if (!believable(row)) return null;
  const fields = fieldsOf(row);
  const place = placeOf(row, fields);
  const pass = textField(fields, 'pass');
  if (place.kind !== USER_KIND || !pass) return null;
  return { ...place, pass, name: nameField(fields, 'name'), address: addressField(fields, 'address') };
}

function byCreation(a, b) {
  if (a.block !== b.block) return a.block < b.block ? -1 : 1;
  if (a.key !== b.key) return a.key < b.key ? -1 : 1;
  return 0;
}

// If one key has several rows, the first created one stands.
function firstOfEach(rows, keyOf) {
  const kept = new Map();
  for (const row of [...rows].sort(byCreation)) {
    if (!kept.has(keyOf(row))) kept.set(keyOf(row), row);
  }
  return kept;
}

// One photo per record, oldest first.
// A pointer with no record behind it has no person behind it, so it is not shown.
function toPhotos(rows, slug) {
  const believed = rows.map((row) => readEventRow(row, slug)).filter(Boolean);
  const ofKind = (kind) => firstOfEach(believed.filter((row) => row.kind === kind), (row) => row.hash);
  const pointers = ofKind(POINTER_KIND);
  const imageNames = ofKind(IMAGE_NAME_KIND);
  return Array.from(ofKind(RECORD_KIND).values(), (record) => ({
    record,
    pointer: pointers.get(record.hash) || null,
    imageName: imageNames.has(record.hash) ? imageNames.get(record.hash).imageName : null,
  }));
}

// One group per person, in the order each was first seen. The address may not exist yet.
function toGroups(photos, users) {
  const groups = new Map();
  for (const photo of photos) {
    const { pass, userName } = photo.record;
    if (!groups.has(pass)) {
      const user = users.get(pass);
      groups.set(pass, {
        name: user ? user.name : null,
        address: user ? user.address : null,
        photos: [],
      });
    }
    const group = groups.get(pass);
    group.photos.push(photo);
    if (!group.name) group.name = userName;
  }
  return Array.from(groups.values());
}

function countLine(photos, complete) {
  const people = new Set(photos.map((photo) => photo.record.pass)).size;
  const line = photos.length + (photos.length === 1 ? ' photo' : ' photos')
    + ' from ' + people + (people === 1 ? ' person' : ' people');
  return complete ? line : 'At least ' + line;
}

async function sha256Hex(bytes) {
  // Browsers leave this out on a page that is not served over https.
  if (!window.crypto || !window.crypto.subtle) return null;
  const digest = await window.crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');
}

// The type comes from the file's first bytes, never from a gateway. Anything else is not shown.
function pictureType(bytes) {
  const b = new Uint8Array(bytes.slice(0, 12));
  const starts = (...head) => head.every((value, i) => b[i] === value);
  if (starts(0xff, 0xd8, 0xff)) return 'image/jpeg';
  if (starts(0x89, 0x50, 0x4e, 0x47)) return 'image/png';
  const webp = [0x57, 0x45, 0x42, 0x50].every((value, i) => b[8 + i] === value);
  if (starts(0x52, 0x49, 0x46, 0x46) && webp) return 'image/webp';
  return null;
}

async function fetchPicture(url) {
  return withTimeout(PICTURE_TIMEOUT_MS, async (signal) => {
    const response = await fetch(url, { signal, credentials: 'omit' });
    if (!response.ok) throw new Error('The gateway refused.');
    return response.arrayBuffer();
  });
}

// A gateway is not trusted. If its bytes differ from the record, the next gateway gets its turn.
async function loadPicture(pointer) {
  let differing = null;
  for (const gateway of PICTURE_GATEWAYS) {
    let bytes;
    try {
      bytes = await fetchPicture(gateway + pointer.ref + '/');
    } catch {
      continue;
    }
    const type = pictureType(bytes);
    const digest = await sha256Hex(bytes);
    if (digest === null) return { state: 'unchecked', bytes, type };
    if (digest === pointer.sha256) return { state: 'same', bytes, type };
    if (!differing) differing = { state: 'differs', bytes, type };
  }
  return differing || { state: 'unreachable' };
}

function addMark(details, text, title, className) {
  const mark = make('span', 'mark ' + className, text);
  mark.title = title;
  details.append(mark);
}

async function fillCard(photo, frame, note, details, label) {
  if (!photo.pointer) {
    note.textContent = 'No picture on record.';
    return;
  }
  const picture = await loadPicture(photo.pointer);
  if (picture.state === 'unreachable') {
    note.textContent = 'This picture cannot be reached just now.';
    return;
  }
  if (picture.state === 'differs') {
    addMark(details, 'Differs from its record', "This picture's hash is not the one in its record.", 'differs');
  }
  if (picture.state === 'unchecked') {
    addMark(details, 'Not checked', "This browser could not check the picture's hash.", 'unchecked');
  }
  const cannotShow = 'This file cannot be shown as a picture.';
  if (!picture.type) {
    note.textContent = cannotShow;
    return;
  }
  const image = document.createElement('img');
  image.alt = label;
  image.decoding = 'async';
  image.addEventListener('load', () => {
    frame.classList.add('shown');
    frame.replaceChildren(image);
  });
  image.addEventListener('error', () => {
    note.textContent = cannotShow;
  });
  image.src = URL.createObjectURL(new Blob([picture.bytes], { type: picture.type }));
}

function addCard(photo, list, label) {
  const note = make('p', 'note', 'Loading picture…');
  const frame = make('div', 'frame');
  frame.append(note);
  const details = make('div', 'details');
  if (photo.imageName) details.append(make('p', 'image-name', photo.imageName));
  const card = make('li', 'card');
  card.append(frame, details);
  list.append(card);
  return () => fillCard(photo, frame, note, details, photo.imageName || label).catch(() => {
    note.textContent = 'This picture cannot be reached just now.';
  });
}

// Adds one person and their cards. Returns the jobs that load the pictures.
function addGroup(group, index, photoNumber) {
  const section = make('section', 'person');
  section.append(make('h2', 'person-name', group.name || 'Person ' + (index + 1)));
  if (group.address) {
    section.append(make('p', 'address', group.address), make('p', 'owned', 'Names owned by this address, by our records'));
  }
  const list = make('ul', 'photos');
  section.append(list);
  ui.people.append(section);
  return group.photos.map((photo, i) => addCard(photo, list, 'Photo ' + (photoNumber + i + 1)));
}

async function runAll(tasks) {
  let next = 0;
  const worker = async () => {
    while (next < tasks.length) {
      const task = tasks[next];
      next += 1;
      await task();
    }
  };
  await Promise.all(Array.from({ length: Math.min(PICTURES_AT_ONCE, tasks.length) }, worker));
}

function showFailure(failure) {
  const busy = failure instanceof ReadFailure && failure.busy;
  setState(
    busy
      ? 'The records service has too many requests just now. Wait a moment and try again.'
      : 'The records cannot be read just now. Try again in a moment.',
    'bad',
  );
  ui.retry.hidden = false;
  if (busy) {
    ui.retry.disabled = true;
    setTimeout(() => { ui.retry.disabled = false; }, failure.waitSeconds * 1000);
  } else {
    ui.retry.disabled = false;
  }
}

async function show(slug) {
  ui.retry.hidden = true;
  ui.count.textContent = '';
  ui.people.replaceChildren();
  setState('Reading the records…', 'wait');
  // The photos need the event's rows. Without the user rows they still show, with fewer words.
  const usersRead = readRows(usersQuery()).catch(() => null);
  let read;
  try {
    read = await readRows(eventQuery(slug));
  } catch (failure) {
    showFailure(failure);
    return;
  }
  const photos = toPhotos(read.rows, slug);
  if (photos.length === 0) {
    setState('No photos for this event yet.', 'plain');
    return;
  }
  const userRows = await usersRead;
  if (userRows) {
    clearState();
  } else {
    setState("People's names and addresses could not all be read just now.", 'plain');
  }
  const believedUsers = userRows ? userRows.rows.map(readUserRow).filter(Boolean) : [];
  const users = firstOfEach(believedUsers, (row) => row.pass);
  ui.count.textContent = countLine(photos, read.complete);
  const jobs = [];
  toGroups(photos, users).forEach((group, index) => {
    jobs.push(...addGroup(group, index, jobs.length));
  });
  await runAll(jobs);
}

function start() {
  const link = new URLSearchParams(window.location.search);
  const slug = link.has('event') ? link.get('event') : DEFAULT_EVENT;
  if (!EVENT_SLUG.test(slug)) {
    ui.event.hidden = true;
    setState('This link does not name an event.', 'bad');
    return;
  }
  ui.event.textContent = slug;
  document.title = slug;
  ui.retry.addEventListener('click', () => show(slug));
  show(slug);
}

start();
</script>
</body>
</html>
