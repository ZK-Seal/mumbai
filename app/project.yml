name: BlankDemo
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: zkSeal
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_NSCameraUsageDescription: "The app takes the photo you choose to send, and reads a badge's QR code."
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: blank.demo.app
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  IDKit:
    url: https://github.com/worldcoin/idkit-swift
    exactVersion: 4.2.0
targets:
  BlankDemo:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - Fonts
    dependencies:
      - package: IDKit
    info:
      path: build/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - blankdemo
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "The app sends your photo to the service on this network."
        UIAppFonts:
          - PublicSans-Variable.ttf
